networks:
  blackhole-network:
    external: true
    name: blackhole-network

volumes:
  mainnet-data-1:
    driver: local
  mainnet-logs-1:
    driver: local
  mainnet-identity-1:
    driver: local
  mainnet-data-2:
    driver: local
  mainnet-logs-2:
    driver: local
  mainnet-identity-2:
    driver: local
  mainnet-data-3:
    driver: local
  mainnet-logs-3:
    driver: local
  mainnet-identity-3:
    driver: local
  letsencrypt:
    driver: local
  nginx-config:
    driver: local
  nginx-logs:
    driver: local
  webroot:
    driver: local
  bridge-data:
    driver: local
  bridge-logs:
    driver: local

services:
  # Bridge Service
  bridge:
    build:
      context: ../../bridge-sdk
      dockerfile: Dockerfile.prod
    container_name: blackhole-bridge
    command: ["./bridge-sdk"]
    ports:
      - "8084:8084"   # Bridge dashboard & API
      - "9090:9090"   # gRPC & Relay server
    environment:
      - NODE_ENV=mainnet
      - LOG_LEVEL=info
      - PORT=8084
      - USE_REAL_BLOCKCHAIN_LISTENERS=true
      - RELAY_PORT=9090
      - DATABASE_PATH=/app/data/bridge.db
      - LOG_FILE=/app/logs/bridge.log
      - BLOCKCHAIN_IDENTITY_DIR=/data/blockchain
    volumes:
      - bridge-data:/app/data
      - bridge-logs:/app/logs
      - mainnet-identity-1:/data/blockchain:ro
    networks:
      - blackhole-network
    user: root
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Wallet Service
  wallet:
    image: golang:1.23-alpine
    container_name: blackhole-wallet
    working_dir: /workspace
    volumes:
      - ../../:/workspace:ro
    environment:
      - BLOCKCHAIN_API_URL=http://blackhole-node-1:8080
      - BRIDGE_API_URL=http://blackhole-bridge:8084
    networks:
      - blackhole-network
    ports:
      - "9000:9000"
    entrypoint: ["/bin/sh","-lc","tr -d '\r' < /workspace/docker/wallet-entrypoint.sh > /tmp/wallet-entrypoint.sh && /bin/sh /tmp/wallet-entrypoint.sh"]
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: blackhole-nginx-mainnet
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-config:/etc/nginx/conf.d
      - nginx-logs:/var/log/nginx
      - letsencrypt:/etc/letsencrypt
      - webroot:/var/www/html
    networks:
      - blackhole-network
    restart: unless-stopped
    depends_on:
      - bridge
      - wallet

  # Certbot for SSL Certificates
  certbot:
    image: certbot/certbot:latest
    container_name: blackhole-certbot-mainnet
    volumes:
      - letsencrypt:/etc/letsencrypt
      - nginx-config:/etc/nginx/conf.d
      - webroot:/var/www/html
    networks:
      - blackhole-network
    command: certonly --webroot --webroot-path=/var/www/html --email admin@blackhole.com --agree-tos --no-eff-email -d blackhole-mainnet.com
    depends_on:
      - nginx
