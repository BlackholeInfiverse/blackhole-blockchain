      - LOG_LEVEL=${LOG_LEVEL:-info}
      - BLOCKCHAIN_PORT=8080
      - RPC_PORT=8545
      - P2P_PORT=30305
      - DATABASE_PATH=./data/blockchain.db
      - LOG_FILE=./logs/blockchain.log
      - PEER_DISCOVERY=${PEER_DISCOVERY:-true}
      - MAX_PEERS=${MAX_PEERS:-50}
      - NODE_ID=blackhole-mainnet-node-3
      - BLOCKCHAIN_IDENTITY_DIR=/data/blockchain
      - MAINNET_MODE=true
      - CONSENSUS_MODE=pos
      - VALIDATOR_STAKE_MINIMUM=1000000
      - BLOCK_TIME=3s
      - MAX_BLOCK_SIZE=1048576
    volumes:
      - mainnet-data-3:/app/data
